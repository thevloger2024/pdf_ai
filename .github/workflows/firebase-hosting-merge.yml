name: Deploy to Firebase Hosting on merge
'on':
  push:
    branches:
      - main
      - master
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      - run: npm run build
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_AI_STUDIO_7761470C_3409_40D6_9834_E02A01B2B653 }}'
          channelId: live
          projectId: ai-studio-7761470c-3409-40d6-9834-e02a01b2b653
